<title>Optics Market Cockpit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#f7f6f2; --surface:#ffffff; --surface-2:#efeee8; --surface-3:#e7e5dd;
  --border:#e0ddd4; --border-strong:#cbc7ba;
  --text-primary:#17181a; --text-secondary:#54555a; --text-muted:#8a8a86;
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-wash:rgba(42,120,214,.10);
  --good:#0ca30c; --warning:#b8790a; --serious:#c85a34; --critical:#d03b3b;
  --warning-bg:#fdf1d8; --critical-bg:#fbe4e2; --good-bg:#e3f5e1; --serious-bg:#fbe9df;
  --s1:#2a78d6; --s2:#c9591e; --s3:#1baf7a; --s4:#a5720a; --s5:#6b7fd7; --s6:#008300; --s7:#4a3aa7; --s8:#2a8a9a;
  --shadow: 0 1px 2px rgba(20,20,15,.04), 0 6px 20px -8px rgba(20,20,15,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#111112; --surface:#1a1a19; --surface-2:#212120; --surface-3:#2a2a28;
    --border:#333331; --border-strong:#46453f;
    --text-primary:#f5f5f2; --text-secondary:#c3c2b7; --text-muted:#8d8c86;
    --accent:#3987e5; --accent-ink:#0b0f14; --accent-wash:rgba(57,135,229,.14);
    --good:#3ed13e; --warning:#fab219; --serious:#ec835a; --critical:#e66767;
    --warning-bg:#3a2d0f; --critical-bg:#3a1c1b; --good-bg:#123216; --serious-bg:#3a2115;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#8b9aef; --s6:#3fbf3f; --s7:#9085e9; --s8:#4eb3c2;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111112; --surface:#1a1a19; --surface-2:#212120; --surface-3:#2a2a28;
  --border:#333331; --border-strong:#46453f;
  --text-primary:#f5f5f2; --text-secondary:#c3c2b7; --text-muted:#8d8c86;
  --accent:#3987e5; --accent-ink:#0b0f14; --accent-wash:rgba(57,135,229,.14);
  --good:#3ed13e; --warning:#fab219; --serious:#ec835a; --critical:#e66767;
  --warning-bg:#3a2d0f; --critical-bg:#3a1c1b; --good-bg:#123216; --serious-bg:#3a2115;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#8b9aef; --s6:#3fbf3f; --s7:#9085e9; --s8:#4eb3c2;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--text-primary); font-family:'IBM Plex Sans',system-ui,sans-serif; margin:0;}
h1,h2,h3,.display{font-family:'Archivo',system-ui,sans-serif; text-wrap:balance; letter-spacing:-.01em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
a{color:var(--accent);}
.wrap{max-width:1320px; margin:0 auto; padding:0 20px 60px;}
::selection{background:var(--accent-wash);}

/* ---------- Header / cockpit chrome ---------- */
.cockpit-header{border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; z-index:40;}
.header-top{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 20px; max-width:1320px; margin:0 auto;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:30px; height:30px; border-radius:8px; background:conic-gradient(from 220deg, var(--s1), var(--s7), var(--s3), var(--s1)); flex:none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15);}
.brand-text .name{font-family:'Archivo'; font-weight:800; font-size:16px; line-height:1.1;}
.brand-text .tag{font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.08em;}
.header-meta{font-size:12px; color:var(--text-muted); text-align:right; line-height:1.5;}
.theme-btn{border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text-secondary); border-radius:7px; padding:6px 10px; font-size:12px; cursor:pointer; font-family:inherit;}
.theme-btn:hover{border-color:var(--accent); color:var(--accent);}

.kpi-strip{display:grid; grid-template-columns:repeat(6,1fr); gap:1px; background:var(--border); border-top:1px solid var(--border); border-bottom:1px solid var(--border);}
.kpi{background:var(--surface); padding:12px 16px;}
.kpi .lbl{font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.07em; margin-bottom:4px;}
.kpi .val{font-family:'Archivo'; font-weight:800; font-size:21px; line-height:1.1;}
.kpi .sub{font-size:11px; color:var(--text-secondary); margin-top:3px;}
.kpi.jump{cursor:pointer;}
.kpi.jump:hover{background:var(--accent-wash);}
@media (max-width:1050px){.kpi-strip{grid-template-columns:repeat(3,1fr);}}
@media (max-width:620px){.kpi-strip{grid-template-columns:repeat(2,1fr);}}

/* ---------- Tabs ---------- */
.tabbar{display:flex; gap:4px; overflow-x:auto; padding:10px 20px; max-width:1320px; margin:0 auto; border-bottom:1px solid var(--border); background:var(--surface);}
.tabbar::-webkit-scrollbar{height:0;}
.tab-btn{flex:none; font-family:'IBM Plex Sans'; font-weight:500; font-size:12.5px; padding:8px 13px; border-radius:20px; border:1px solid transparent; background:transparent; color:var(--text-secondary); cursor:pointer; white-space:nowrap;}
.tab-btn:hover{background:var(--surface-2);}
.tab-btn.featured{border-color:var(--accent); color:var(--accent); background:var(--accent-wash); font-weight:600;}
.tab-btn.active{background:var(--accent); color:var(--accent-ink); font-weight:600;}

section.panel{display:none; padding-top:26px;}
section.panel.active{display:block; animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1;}}

.panel h2.title{font-size:20px; font-weight:800; margin:0 0 4px;}
.panel .lede{color:var(--text-secondary); font-size:13.5px; margin:0 0 20px; max-width:820px;}

.grid{display:grid; gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; box-shadow:var(--shadow);}
.card h3{font-size:13.5px; font-weight:700; margin:0 0 2px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
.card .card-note{font-size:11.5px; color:var(--text-muted); margin:0 0 14px;}
.card-span2{grid-column:span 2;}
.card.jump{cursor:pointer;}
.card.jump:hover{border-color:var(--accent);}
.card .jump-hint{font-size:11px; color:var(--accent); font-weight:600; margin:8px 0 0;}
.brand-hero{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin:0 0 18px;}
.brand-hero .cell{background:var(--surface); padding:14px 16px;}
.brand-hero .cell .lbl{font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px;}
.brand-hero .cell .v{font-family:'Archivo'; font-weight:800; font-size:19px;}
.brand-hero .cell .s{font-size:11px; color:var(--text-secondary); margin-top:3px;}
@media (max-width:900px){.card-span2{grid-column:span 1;} .brand-hero{grid-template-columns:repeat(2,1fr);}}

/* ---------- Pills / status ---------- */
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:2px 9px; border-radius:20px; line-height:1.7;}
.pill.good{background:var(--good-bg); color:var(--good);}
.pill.warning{background:var(--warning-bg); color:var(--warning);}
.pill.serious{background:var(--serious-bg); color:var(--serious);}
.pill.critical{background:var(--critical-bg); color:var(--critical);}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;}
table.data{width:100%; border-collapse:collapse; font-size:12.5px;}
table.data th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:600; padding:6px 10px; border-bottom:1px solid var(--border-strong); white-space:nowrap;}
table.data td{padding:7px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
table.data tr:last-child td{border-bottom:none;}
table.data tbody tr:hover{background:var(--surface-2);}
.num{font-family:'IBM Plex Mono'; font-variant-numeric:tabular-nums; text-align:right;}

/* ---------- Chart primitives ---------- */
.legend{display:flex; flex-wrap:wrap; gap:10px 16px; font-size:11.5px; color:var(--text-secondary); margin-top:8px;}
.legend .lg-item{display:flex; align-items:center; gap:6px;}
.legend .sw{width:9px; height:9px; border-radius:2px; flex:none;}
.axis-label{font-size:10px; fill:var(--text-muted); font-family:'IBM Plex Mono',monospace;}
.grid-line{stroke:var(--border); stroke-width:1;}
.tooltip{position:fixed; pointer-events:none; background:var(--text-primary); color:var(--bg); font-size:11.5px; padding:7px 10px; border-radius:7px; z-index:200; opacity:0; transition:opacity .1s; max-width:230px; line-height:1.4; box-shadow:0 8px 20px rgba(0,0,0,.25);}
.tooltip.show{opacity:1;}
.tooltip b{display:block; margin-bottom:2px;}

/* ---------- What-if simulator ---------- */
.sim-controls{display:flex; flex-wrap:wrap; gap:18px; align-items:flex-end; margin-bottom:18px;}
.sim-field{display:flex; flex-direction:column; gap:6px;}
.sim-field label{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:600;}
.sim-field select{font-family:inherit; font-size:13px; padding:7px 10px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface); color:var(--text-primary); min-width:220px;}
.slider-row{display:flex; align-items:center; gap:12px;}
input[type=range]{width:260px; accent-color:var(--accent);}
.slider-val{font-family:'IBM Plex Mono'; font-weight:600; font-size:15px; min-width:56px;}
.sim-results{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:18px;}
.sim-results .cell{background:var(--surface); padding:14px 16px;}
.sim-results .cell .lbl{font-size:10.5px; text-transform:uppercase; color:var(--text-muted); letter-spacing:.06em; margin-bottom:5px;}
.sim-results .cell .v{font-family:'Archivo'; font-weight:800; font-size:19px;}
.sim-results .cell .v small{font-family:'IBM Plex Sans'; font-weight:500; font-size:12px; color:var(--text-secondary);}
@media (max-width:800px){.sim-results{grid-template-columns:repeat(2,1fr);}}

/* ---------- Insight constellation ---------- */
.insight-row{display:grid; grid-template-columns:34px 1fr 100px 90px; gap:14px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);}
.insight-row:last-child{border-bottom:none;}
.rank-badge{width:28px; height:28px; border-radius:8px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono'; font-weight:600; font-size:12px; color:var(--text-secondary);}
.insight-title{font-size:13px; font-weight:600;}
.insight-meta{font-size:11.5px; color:var(--text-muted); margin-top:2px;}
.cc-bar-track{height:6px; border-radius:4px; background:var(--surface-3); position:relative; overflow:visible;}
.cc-bar-fill{height:100%; border-radius:4px; background:var(--accent);}
.cc-bar-band{position:absolute; top:-3px; height:12px; width:2px; background:var(--text-muted); opacity:.5;}

footer.methodology{border-top:1px solid var(--border); margin-top:50px; padding:26px 20px 60px; background:var(--surface-2);}
footer.methodology .wrap{font-size:12px; color:var(--text-secondary); line-height:1.7;}
footer.methodology h4{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin:0 0 8px;}
footer.methodology ul{margin:0; padding-left:18px;}
.mockup-banner{background:var(--accent-wash); color:var(--text-secondary); font-size:12.5px; text-align:center; padding:9px 18px; border-bottom:1px solid var(--border); line-height:1.45;}
.mockup-banner b{color:var(--text-primary); font-weight:700;}
</style>

</head>

<script>
/* ============================================================
   COCKPIT RUNTIME -- chart primitives, per-tab renderers, init
   ============================================================ */
const CATS = ['#s1','#s2','#s3','#s4','#s5','#s6','#s7','#s8'];
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function seriesColor(i){ return cssVar('--s'+((i%8)+1)); }
function accentRamp(i, n){
  const t = n<=1 ? 0 : i/Math.max(n-1,1);
  const a = [42,120,214], b = [42,138,154];
  const m = a.map((c,k)=>Math.round(c+(b[k]-c)*t));
  const alpha = (0.95 - t*0.45).toFixed(2);
  return `rgba(${m[0]},${m[1]},${m[2]},${alpha})`;
}
const fmt = {
  int: n => Math.round(n).toLocaleString('en-US'),
  usd: n => {
    const a = Math.abs(n);
    if(a>=1e9) return (n/1e9).toFixed(2)+'B';
    if(a>=1e6) return (n/1e6).toFixed(1)+'M';
    if(a>=1e3) return (n/1e3).toFixed(1)+'K';
    return Math.round(n).toString();
  },
  usd0: n => '$'+fmt.usd(n),
  pct: (n,d=1) => (n>0?'+':'')+n.toFixed(d)+'%',
  num: (n,d=2) => n.toFixed(d),
};
const svgns = 'http://www.w3.org/2000/svg';
function el(tag, attrs={}, parent=null){
  const e = document.createElementNS(svgns, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function htmlEl(tag, cls, parent){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(parent) parent.appendChild(e);
  return e;
}
const tooltipEl = document.getElementById('tooltip');
function showTip(evt, html){
  tooltipEl.innerHTML = html;
  tooltipEl.classList.add('show');
  moveTip(evt);
}
function moveTip(evt){
  const pad = 14;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if(x + 240 > window.innerWidth) x = evt.clientX - 240;
  if(y + 90 > window.innerHeight) y = evt.clientY - 90;
  tooltipEl.style.left = x+'px'; tooltipEl.style.top = y+'px';
}
function hideTip(){ tooltipEl.classList.remove('show'); }

/* ---- horizontal bar chart with optional CI whiskers ---- */
function hBarChart(container, items, opts={}){
  container.innerHTML='';
  const W = container.clientWidth || 520, rowH = opts.rowH||26, gap=8, leftLabelW = opts.labelW||150;
  const maxAbs = opts.domain || Math.max(...items.map(d=>Math.max(Math.abs(d.value),Math.abs(d.lo||d.value),Math.abs(d.hi||d.value))))*1.15;
  const plotW = W - leftLabelW - 60;
  const H = items.length*(rowH+gap)+10;
  const svg = el('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`});
  const x0 = leftLabelW;
  const scaleX = v => opts.zeroCentered ? x0 + plotW/2 + (v/maxAbs)*(plotW/2) : x0 + (v/maxAbs)*plotW;
  const zeroX = scaleX(0);
  const trackFill = cssVar('--surface-3');
  items.forEach((d,i)=>{
    const y = 10 + i*(rowH+gap);
    const label = el('text',{x:leftLabelW-10,y:y+rowH/2+4,'text-anchor':'end','font-size':11.5,fill:cssVar('--text-secondary')},svg);
    label.textContent = d.label;
    el('rect',{x:x0,y:y,width:Math.max(plotW,0),height:rowH,rx:4,fill:trackFill},svg);
    const barX = Math.min(zeroX, scaleX(d.value));
    const barW = Math.max(Math.abs(scaleX(d.value)-zeroX),2);
    const fill = d.color || (opts.ramp ? accentRamp(i, items.length) : seriesColor(i));
    const rect = el('rect',{x:barX,y:y,width:barW,height:rowH,rx:4,fill,opacity:opts.dim&&opts.dim(d)?0.35:1},svg);
    rect.style.cursor='pointer';
    rect.addEventListener('mousemove',e=>{showTip(e, `<b>${d.label}</b>${d.tip||fmt.num(d.value)}`); });
    rect.addEventListener('mouseleave',hideTip);
    if(d.lo!==undefined && d.hi!==undefined){
      const x1=scaleX(d.lo), x2=scaleX(d.hi);
      el('line',{x1,x2,y1:y+rowH/2,y2:y+rowH/2,stroke:cssVar('--text-muted'),'stroke-width':1.5},svg);
      el('line',{x1,x2:x1,y1:y+rowH/2-4,y2:y+rowH/2+4,stroke:cssVar('--text-muted'),'stroke-width':1.5},svg);
      el('line',{x1:x2,x2,y1:y+rowH/2-4,y2:y+rowH/2+4,stroke:cssVar('--text-muted'),'stroke-width':1.5},svg);
    }
    const valTxt = el('text',{x: scaleX(d.value) + (d.value>=0?8:-8), y:y+rowH/2+4,
      'text-anchor': d.value>=0?'start':'end','font-size':11,'font-family':'IBM Plex Mono',fill:cssVar('--text-primary')},svg);
    valTxt.textContent = d.valueLabel!==undefined? d.valueLabel : fmt.num(d.value);
  });
  if(opts.zeroCentered) el('line',{x1:zeroX,x2:zeroX,y1:4,y2:H-6,class:'grid-line'},svg);
  container.appendChild(svg);
}

/* ---- vertical grouped bar chart ---- */
function vBarChart(container, groups, seriesNames, opts={}){
  container.innerHTML='';
  const rotateLabels = groups.length > 5;
  const W = container.clientWidth || 520, H = opts.h||240, padL=44, padB=rotateLabels?54:28, padT=14, padR=10;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const allVals = groups.flatMap(g=>g.values);
  const maxV = opts.max || Math.max(...allVals)*1.15 || 1;
  const vfmt = opts.valueFmt || fmt.usd;
  const svg = el('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`});
  [0,0.25,0.5,0.75,1].forEach(f=>{
    const y = padT + plotH*(1-f);
    el('line',{x1:padL,x2:W-padR,y1:y,y2:y,class:'grid-line'},svg);
    const t = el('text',{x:padL-6,y:y+3,'text-anchor':'end',class:'axis-label'},svg); t.textContent = vfmt(maxV*f);
  });
  const gW = plotW/groups.length;
  const barW = Math.min(22, (gW-10)/seriesNames.length);
  groups.forEach((g,gi)=>{
    const gx = padL + gi*gW;
    g.values.forEach((v,si)=>{
      const bh = Math.max((v/maxV)*plotH,0);
      const bx = gx + gW/2 - (seriesNames.length*barW)/2 + si*barW;
      const fill = g.color || (seriesNames.length>1 ? seriesColor(si) : seriesColor(gi));
      const rect = el('rect',{x:bx,y:padT+plotH-bh,width:Math.max(barW-2,2),height:bh,rx:3,fill},svg);
      rect.addEventListener('mousemove',e=>showTip(e,`<b>${g.label}</b>${seriesNames[si]}: ${vfmt(v)}`));
      rect.addEventListener('mouseleave',hideTip);
    });
    const label = g.label.length>16 ? g.label.slice(0,15)+'…' : g.label;
    let t;
    if(rotateLabels){
      t = el('text',{x:gx+gW/2,y:H-padB+14,'text-anchor':'end','font-size':10,'font-family':'IBM Plex Mono',fill:cssVar('--text-muted'),
        transform:`rotate(-38 ${gx+gW/2} ${H-padB+14})`},svg);
    } else {
      t = el('text',{x:gx+gW/2,y:H-8,'text-anchor':'middle',class:'axis-label'},svg);
    }
    t.textContent = label;
    const titleTip = el('title',{},t); titleTip.textContent = g.label;
  });
  container.appendChild(svg);
  if(seriesNames.length>1) renderLegend(container, seriesNames.map((n,i)=>({label:n,color:seriesColor(i)})));
}

/* ---- line chart (single or multi series, time on x) ---- */
function lineChart(container, series, xLabels, opts={}){
  container.innerHTML='';
  const W = container.clientWidth||520, H = opts.h||220, padL=48,padR=16,padT=14,padB=26;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const allV = series.flatMap(s=>s.values);
  const minV = opts.min!==undefined?opts.min:Math.min(0,...allV);
  const maxV = (opts.max||Math.max(...allV))*1.1;
  const svg = el('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`});
  const n = xLabels.length;
  const xScale = i => padL + (n<=1?0:(i/(n-1))*plotW);
  const yScale = v => padT + plotH - ((v-minV)/(maxV-minV||1))*plotH;
  [0,0.25,0.5,0.75,1].forEach(f=>{
    const y = padT+plotH*(1-f);
    el('line',{x1:padL,x2:W-padR,y1:y,y2:y,class:'grid-line'},svg);
    const t=el('text',{x:padL-6,y:y+3,'text-anchor':'end',class:'axis-label'},svg); t.textContent=fmt.usd(minV+(maxV-minV)*f);
  });
  const step = Math.max(1, Math.round(n/6));
  xLabels.forEach((lab,i)=>{ if(i%step===0 || i===n-1){
    const anchor = i===0 ? 'start' : (i===n-1 ? 'end' : 'middle');
    const t=el('text',{x:xScale(i),y:H-8,'text-anchor':anchor,class:'axis-label'},svg); t.textContent=lab; }});
  series.forEach((s,si)=>{
    const color = s.color || seriesColor(si);
    let d='';
    s.values.forEach((v,i)=>{ d += (i===0?'M':'L')+xScale(i).toFixed(1)+' '+yScale(v).toFixed(1)+' '; });
    if(opts.area){
      const areaD = d + `L${xScale(n-1)} ${yScale(minV)} L${xScale(0)} ${yScale(minV)} Z`;
      el('path',{d:areaD, fill:color, opacity:0.08},svg);
    }
    el('path',{d,fill:'none',stroke:color,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'},svg);
    const lastI = s.values.length-1;
    const dot = el('circle',{cx:xScale(lastI),cy:yScale(s.values[lastI]),r:4,fill:color,stroke:cssVar('--surface'),'stroke-width':2},svg);
    s.values.forEach((v,i)=>{
      const hit = el('circle',{cx:xScale(i),cy:yScale(v),r:8,fill:'transparent'},svg);
      hit.addEventListener('mousemove',e=>showTip(e,`<b>${xLabels[i]}</b>${s.name}: ${fmt.usd0?fmt.usd0(v):v}`));
      hit.addEventListener('mouseleave',hideTip);
    });
  });
  container.appendChild(svg);
  if(series.length>1) renderLegend(container, series.map((s,i)=>({label:s.name,color:s.color||seriesColor(i)})));
}

/* ---- scatter chart ---- */
function scatterChart(container, points, opts={}){
  container.innerHTML='';
  const W=container.clientWidth||520,H=opts.h||320,padL=48,padR=20,padT=16,padB=34;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const xs=points.map(p=>p.x), ys=points.map(p=>p.y);
  const xMin=opts.xMin!==undefined?opts.xMin:Math.min(...xs), xMax=opts.xMax!==undefined?opts.xMax:Math.max(...xs);
  const yMin=opts.yMin!==undefined?opts.yMin:Math.min(...ys), yMax=opts.yMax!==undefined?opts.yMax:Math.max(...ys);
  const xr = xMax-xMin||1, yr = yMax-yMin||1;
  const svg = el('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`});
  const xScale=v=>padL+((v-xMin)/xr)*plotW, yScale=v=>padT+plotH-((v-yMin)/yr)*plotH;
  [0,0.5,1].forEach(f=>{
    const y=padT+plotH*(1-f); el('line',{x1:padL,x2:W-padR,y1:y,y2:y,class:'grid-line'},svg);
    const x=padL+plotW*f; el('line',{x1:x,x2:x,y1:padT,y2:H-padB,class:'grid-line'},svg);
  });
  if(opts.xMid!==undefined) el('line',{x1:xScale(opts.xMid),x2:xScale(opts.xMid),y1:padT,y2:H-padB,stroke:cssVar('--border-strong'),'stroke-dasharray':'3,3'},svg);
  if(opts.yMid!==undefined) el('line',{x1:padL,x2:W-padR,y1:yScale(opts.yMid),y2:yScale(opts.yMid),stroke:cssVar('--border-strong'),'stroke-dasharray':'3,3'},svg);
  const xt=el('text',{x:padL+plotW/2,y:H-6,'text-anchor':'middle',class:'axis-label'},svg); xt.textContent=opts.xLabel||'';
  const yt=el('text',{x:12,y:padT+plotH/2,'text-anchor':'middle',class:'axis-label',transform:`rotate(-90 12 ${padT+plotH/2})`},svg); yt.textContent=opts.yLabel||'';
  points.forEach(p=>{
    const r = p.r || 6;
    const c = el('circle',{cx:xScale(p.x),cy:yScale(p.y),r,fill:p.color||seriesColor(0),stroke:cssVar('--surface'),'stroke-width':2,opacity:0.9},svg);
    c.style.cursor='pointer';
    c.addEventListener('mousemove',e=>showTip(e,`<b>${p.label}</b>${p.tip||`${opts.xLabel}: ${fmt.num(p.x)} · ${opts.yLabel}: ${fmt.num(p.y)}`}`));
    c.addEventListener('mouseleave',hideTip);
    if(p.showLabel){
      const px = xScale(p.x), py = yScale(p.y);
      const anchor = px > W-90 ? 'end' : (px < padL+70 ? 'start' : 'middle');
      const labelAbove = py - r - 5 > 12;
      const ly = labelAbove ? py-r-5 : py+r+13;
      const lt = el('text',{x:px,y:ly,'text-anchor':anchor,'font-size':10,fill:cssVar('--text-secondary')},svg);

<script>
const D = DASHBOARD_DATA;
let NASH_COST_RATIO = 0.58;

function solveLinear(A, b){
  const n = b.length;
  const M = A.map((row,i)=>row.concat([b[i]]));
  for(let k=0;k<n;k++){
    let piv=k;
    for(let i=k+1;i<n;i++) if(Math.abs(M[i][k])>Math.abs(M[piv][k])) piv=i;
    [M[k], M[piv]] = [M[piv], M[k]];
    const d = M[k][k];
    if(Math.abs(d)<1e-12) return null;
    for(let j=k;j<=n;j++) M[k][j]/=d;
    for(let i=0;i<n;i++) if(i!==k){
      const f=M[i][k];
      for(let j=k;j<=n;j++) M[i][j]-=f*M[k][j];
    }
  }
  return M.map(r=>r[n]);
}

/** Local Bertrand best-response: linear residual demand calibrated to NegBin ε, rivals fixed. */
function nashIsoelastic(p0, e, costRatio){
  const c = costRatio * p0;
  const lernerNow = (p0-c)/p0;
  if(!(e < 0)){
    return {ok:false, c, pNash:null, lernerNow, lernerNash:null, gapPct:null, inelastic:true,
      reason: 'Price sensitivity is not negative — no stable price.'};
  }
  const pNash = (-p0/e + p0 + c) / 2;
  if(!(pNash>0)) return {ok:false, c, pNash:null, lernerNow, lernerNash:null, gapPct:null, inelastic:e>=-1,
    reason:'Stable price is not positive at this cost.'};
  return {ok:true, c, pNash, lernerNow, lernerNash: (pNash-c)/pNash, gapPct: 100*(pNash/p0 - 1), inelastic: e>=-1};
}

/** 3-category linear-demand Bertrand-Nash using NegBin own-ε and Nested-Logit cross-ε matrix. */
function nashLinearTrio(costRatio){
  const ids = ['Full-Frame Mirrorless','APS-C Mirrorless','DSLR'];
  const X = D.cross_elasticity_matrix;
  const players = ids.map(id=>{
    const w = D.whatif_baseline.find(c=>c.category===id);
    const el = D.elasticity.by_category.find(c=>c.category===id);
    return {id, p:w.base_price, q:w.base_units, eOwn:el.negbin_elasticity, cross:X[id]};
  });
  const b = players.map((pi,i)=>players.map((pj,j)=>{
    if(i===j) return -pi.eOwn * pi.q / pi.p;
    const eij = pi.cross[pj.id];
    return (eij||0) * pi.q / pj.p;
  }));
  const a = players.map((pi,i)=>{
    let intercept = pi.q + b[i][i]*pi.p;
    players.forEach((pj,j)=>{ if(j!==i) intercept -= b[i][j]*pj.p; });
    return intercept;
  });
  const A = players.map((pi,i)=>players.map((pj,j)=> i===j ? 2*b[i][i] : -b[i][j]));
  const rhs = players.map((pi,i)=> a[i] + b[i][i]*(costRatio*pi.p));
  const pStar = solveLinear(A, rhs);
  if(!pStar) return null;
  return players.map((pi,i)=>({
    category: pi.id, pNow: pi.p, pNash: pStar[i],
    gapPct: 100*(pStar[i]/pi.p - 1), c: costRatio*pi.p,
  }));
}

function nashForCategory(catName, costRatio){
  const w = D.whatif_baseline.find(c=>c.category===catName);
  const el = D.elasticity.by_category.find(c=>c.category===catName);
  if(!w || !el || el.negbin_elasticity==null) return null;
  const n = nashIsoelastic(w.base_price, el.negbin_elasticity, costRatio);
  return Object.assign({category:catName, pNow:w.base_price, e:el.negbin_elasticity, units:w.base_units}, n);
}

    rows.forEach(r=>{
      const tr = htmlEl('tr',null,tbN);
      const move = r.ok ? ((r.gapPct>=0?'+':'')+r.gapPct.toFixed(0)+'%') : '—';
      const st = !r.ok ? statusPill('Warn')+' no stable price'
        : r.inelastic ? statusPill('Warn')+' weak sensitivity — raise, don’t treat as a target'
        : (Math.abs(r.gapPct)<8 ? statusPill('Pass')+' near stable' : (r.gapPct>0 ? 'below stable' : 'above stable'));
      tr.innerHTML = `<td>${r.category}</td><td class="num">${r.e.toFixed(2)}</td><td class="num">$${Math.round(r.pNow).toLocaleString('en-US')}</td>
        <td class="num">${r.ok?'$'+Math.round(r.pNash).toLocaleString('en-US'):'—'}</td><td class="num">${move}</td><td>${st}</td>`;
    });
    const trio = nashLinearTrio(NASH_COST_RATIO);
    if(trio){
      const note = htmlEl('p','card-note',nashWrap);
      note.style.marginTop='14px';
      note.textContent = 'Three-way stable prices (Full-Frame, APS-C, DSLR) — all three move together. Not the same as the one-at-a-time prices above.';
      const t3 = htmlEl('table','data',nashWrap);
      t3.innerHTML='<thead><tr><th>Category</th><th>Today’s price</th><th>Three-way stable</th><th>Move</th></tr></thead>';
      const tb3 = htmlEl('tbody',null,t3);
      trio.forEach(r=>{
        const tr = htmlEl('tr',null,tb3);
        tr.innerHTML = `<td>${r.category}</td><td class="num">$${Math.round(r.pNow).toLocaleString('en-US')}</td>
          <td class="num">$${Math.round(r.pNash).toLocaleString('en-US')}</td>
          <td class="num">${r.gapPct>=0?'+':''}${r.gapPct.toFixed(0)}%</td>`;
      });
    }
  }
  nashSlider.addEventListener('input', drawNash);
  drawNash();
}

/* =========================================================
   WHAT-IF SIMULATOR
   ========================================================= */
function renderSimulator(panel){
  panel.innerHTML='';
  sectionHead(panel,'What-if pricing',
    'Move the price and see units and revenue in this mockup. Compact / DSLR / Full-Frame / APS-C start from published last-12-month shipments; other categories stay synthetic. The band is a range of outcomes. The marker is the stable price if rivals stay put.');

  const controls = htmlEl('div','sim-controls',panel);
  const validCats = D.whatif_baseline.filter(c=>c.elasticity!==null && c.elasticity!==undefined);

  const f1 = htmlEl('div','sim-field',controls);
  htmlEl('label',null,f1).textContent='Category';
  const sel = htmlEl('select',null,f1);
  validCats.forEach(c=>{
    const o=document.createElement('option');
    o.value=c.category;
    o.textContent = c.category + (c.source==='CIPA' ? ' · industry shipments' : ' · mockup');
    sel.appendChild(o);
  });

  const f2 = htmlEl('div','sim-field',controls);
  htmlEl('label',null,f2).textContent='Price change';
  const sliderRow = htmlEl('div','slider-row',f2);
  const slider = htmlEl('input',null,sliderRow); slider.type='range'; slider.min=-30; slider.max=30; slider.value=0; slider.step=1;
  const sliderVal = htmlEl('span','slider-val mono',sliderRow); sliderVal.textContent='+0%';

  const f3 = htmlEl('div','sim-field',controls);
  htmlEl('label',null,f3).textContent='Stable price';
  const snapBtn = htmlEl('button','theme-btn',f3); snapBtn.type='button'; snapBtn.textContent='Move to stable price';

  const nashNote = htmlEl('p',null,panel);
  nashNote.style.cssText='font-size:12.5px;color:var(--text-secondary);margin:0 0 14px;max-width:820px;';

  const results = htmlEl('div','sim-results',panel);
  const cells = {};
  ['New price','Projected units','Projected revenue','Δ Revenue vs. baseline'].forEach(l=>{
    const c = htmlEl('div','cell',results);
    htmlEl('div','lbl',c).textContent=l;
    cells[l] = htmlEl('div','v mono',c);
  });

  const chartCard = card(panel,'Volume response curve','Shaded band = range of outcomes at each price point.');
  const chartDiv = htmlEl('div',null,chartCard);

  function update(){
    const cat = validCats.find(c=>c.category===sel.value);
    const pct = +slider.value;
    sliderVal.textContent = (pct>=0?'+':'')+pct+'%';
    const priceFactor = 1+pct/100;
    const e = cat.elasticity, se = cat.elasticity_se||0.05;
    const units = cat.base_units*Math.pow(priceFactor, e);
    const unitsLo = cat.base_units*Math.pow(priceFactor, e-1.96*se);
    const unitsHi = cat.base_units*Math.pow(priceFactor, e+1.96*se);
    const newPrice = cat.base_price*priceFactor;
    const revenue = units*newPrice;
    const deltaRev = 100*(revenue-cat.base_revenue)/cat.base_revenue;
    cells['New price'].innerHTML = `$${newPrice.toFixed(0)}`;
    cells['Projected units'].innerHTML = `${fmt.int(units)} <small>[${fmt.int(unitsLo)}–${fmt.int(unitsHi)}]</small>`;
    cells['Projected revenue'].innerHTML = fmt.usd0(revenue);
    cells['Δ Revenue vs. baseline'].innerHTML = `<span style="color:${deltaRev>=0?cssVar('--good'):cssVar('--critical')}">${fmt.pct(deltaRev)}</span>`;

    const nash = nashForCategory(cat.category, NASH_COST_RATIO);
    if(nash && nash.ok){
      const inRange = Math.abs(nash.gapPct)<=30;
      const caveat = nash.inelastic ? ' Demand is weakly sensitive — treat as a raise-price direction, not a dollar target.' : '';
      nashNote.innerHTML = `Stable price <b>$${Math.round(nash.pNash).toLocaleString('en-US')}</b> (${nash.gapPct>=0?'+':''}${nash.gapPct.toFixed(0)}% vs today) at ${(NASH_COST_RATIO*100).toFixed(0)}% cost share.${caveat} ${inRange?'':'That point sits outside the ±30% slider — see Pricing.'}`;
      snapBtn.disabled = !inRange;
    } else {
      nashNote.textContent = (nash && nash.reason) ? nash.reason : 'No stable price for this category.';
      snapBtn.disabled = true;
    }

    // response curve across -30..+30
    const xs=[]; const mid=[]; const lo=[]; const hi=[];
    for(let p=-30;p<=30;p+=3){
      const pf=1+p/100; xs.push(p+'%');
      mid.push(cat.base_units*Math.pow(pf,e));
      lo.push(cat.base_units*Math.pow(pf,e-1.96*se));
      hi.push(cat.base_units*Math.pow(pf,e+1.96*se));
    }
    chartDiv.innerHTML='';
    const W=chartDiv.clientWidth||600,H=230,padL=48,padR=16,padT=14,padB=26,plotW=W-padL-padR,plotH=H-padT-padB;
    const svg = el('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`});
    const maxV = Math.max(...hi)*1.1, minV=0;
    const xScale=i=>padL+(i/(xs.length-1))*plotW, yScale=v=>padT+plotH-((v-minV)/(maxV-minV))*plotH;
    [0,0.5,1].forEach(f=>{ const y=padT+plotH*(1-f); el('line',{x1:padL,x2:W-padR,y1:y,y2:y,class:'grid-line'},svg);
      const t=el('text',{x:padL-6,y:y+3,'text-anchor':'end',class:'axis-label'},svg); t.textContent=fmt.usd(minV+(maxV-minV)*f); });
    let bandD='M'+xScale(0)+' '+yScale(lo[0]);
    lo.forEach((v,i)=>{ if(i>0) bandD+=' L'+xScale(i)+' '+yScale(v); });
    for(let i=hi.length-1;i>=0;i--) bandD+=' L'+xScale(i)+' '+yScale(hi[i]);
    bandD+=' Z';
    el('path',{d:bandD, fill:cssVar('--accent'), opacity:0.12},svg);
    let lineD=''; mid.forEach((v,i)=>{ lineD += (i===0?'M':'L')+xScale(i)+' '+yScale(v)+' '; });
    el('path',{d:lineD, fill:'none', stroke:cssVar('--accent'), 'stroke-width':2},svg);
    const curX = xScale((pct+30)/3);
    el('line',{x1:curX,x2:curX,y1:padT,y2:H-padB,stroke:cssVar('--text-muted'),'stroke-dasharray':'3,3'},svg);
    if(nash && nash.ok && Math.abs(nash.gapPct)<=30){
      const nX = xScale((nash.gapPct+30)/3);
      el('line',{x1:nX,x2:nX,y1:padT,y2:H-padB,stroke:cssVar('--s7'),'stroke-width':1.5,'stroke-dasharray':'4,3'},svg);
      const nt=el('text',{x:nX+4,y:padT+12,'font-size':10,fill:cssVar('--s7')},svg); nt.textContent='Stable';
    }
    [0,6,12].forEach(i=>{ const t=el('text',{x:xScale(i),y:H-8,'text-anchor':'middle',class:'axis-label'},svg); t.textContent=xs[i]; });
    chartDiv.appendChild(svg);
  }
  sel.addEventListener('change',update); slider.addEventListener('input',update);
  snapBtn.addEventListener('click', ()=>{
    const cat = validCats.find(c=>c.category===sel.value);
    const nash = nashForCategory(cat.category, NASH_COST_RATIO);
    if(!nash || !nash.ok) return;
    const clamped = Math.max(-30, Math.min(30, Math.round(nash.gapPct)));
    slider.value = String(clamped);
    update();
  });
  update();
  RERENDER_ON_SHOW['simulator'] = update;

  const c2 = card(panel,'Saved scenarios (range of outcomes)','Low / mid / high revenue if you ran the mockup many times.');
  const wrap = htmlEl('div','tbl-wrap',c2);
  const t = htmlEl('table','data',wrap);
  t.innerHTML='<thead><tr><th>Scenario</th><th>Price change</th><th>Low</th><th>Mid</th><th>High</th><th>Chance revenue rises</th></tr></thead>';
  const tb = htmlEl('tbody',null,t);
  D.simulation.scenario_library.forEach(s=>{
    const tr = htmlEl('tr',null,tb);
    tr.innerHTML = `<td>${s.scenario_name}</td><td class="num">${s.price_change_pct>0?'+':''}${s.price_change_pct}%</td>
      <td class="num">${fmt.usd0(s.projected_revenue_p10)}</td><td class="num">${fmt.usd0(s.projected_revenue_p50)}</td>
      <td class="num">${fmt.usd0(s.projected_revenue_p90)}</td><td class="num">${(s.prob_revenue_increases*100).toFixed(0)}%</td>`;
  });
}

/* =========================================================
   INSIGHT CONSTELLATION (fuzzy T1/T2 + TOPSIS + QC matrix)
   ========================================================= */
function renderInsights(panel){
  panel.innerHTML='';
  sectionHead(panel,'Priorities',
    'Every action is ranked by impact, fit, and risk in this mockup. Treat the order as a discussion list, not a live recommendation.');

  const c1 = card(panel,'Ranked actions','Bar = priority score; ticks = a range around that score.');
  const ranked = D.fuzzy_prioritization.insights.slice().sort((a,b)=>a.overall_rank-b.overall_rank);
  ranked.forEach(ins=>{
    const row = htmlEl('div','insight-row',c1);
    htmlEl('div','rank-badge',row).textContent='#'+ins.overall_rank;
    const mid = htmlEl('div',null,row);
    htmlEl('div','insight-title',mid).textContent = plainCopy(ins.title);
    htmlEl('div','insight-meta',mid).textContent = plainCopy(ins.recommended_action);
    const trackWrap = htmlEl('div',null,row);
    const track = htmlEl('div','cc-bar-track',trackWrap);
    const fill = htmlEl('div','cc-bar-fill',track); fill.style.width = (ins.topsis_closeness_mid*100)+'%';
    const band = htmlEl('div','cc-bar-band',track); band.style.left = (ins.topsis_closeness_lower*100)+'%';
    const band2 = htmlEl('div','cc-bar-band',track); band2.style.left = (ins.topsis_closeness_upper*100)+'%';
    const right = htmlEl('div',null,row); right.style.cssText='text-align:right;';
    const qc = D.quality_check_matrix.find(q=>q.id===ins.id);
    right.innerHTML = qc? statusPill(qc.overall_qc) : '';
  });

  const g2 = grid(panel);
  const c2 = card(g2,'Priority mix');
  const labels = ['Critical','High','Medium','Low'];
  const counts = labels.map(l=>ranked.filter(r=>r.fuzzy_priority_label===l).length);
  vBarChart(htmlEl('div',null,c2), labels.map((l,i)=>({
    label:l, values:[counts[i]],
    color: l==='Critical' ? cssVar('--critical') : l==='High' ? cssVar('--warning') : l==='Medium' ? cssVar('--s1') : cssVar('--s3'),
  })), ['Insights'],{h:200,max:Math.max(...counts)*1.3, valueFmt:v=>Math.round(v).toString()});

  const c3 = card(g2,'What the ranking weights','How much this mockup cares about impact, fit, cost, and risk. Set by the analyst, not fit to the data.');
  const w = D.fuzzy_prioritization.weights;
  vBarChart(htmlEl('div',null,c3), Object.keys(w).map(k=>({label:k.replace(/_/g,' ').replace('business impact','Impact').replace('strategic fit present day','Fit').replace('fuzzy priority','Priority').replace('implementation cost','Cost').slice(0,16), values:[w[k]]})), ['weight'],{h:200,max:0.4, valueFmt:v=>v.toFixed(2)});

  const c4 = card(panel,'Quality checks','Seven checks per action — Pass / Caution / Fail. Read this before acting on any single number.');
  const wrap = htmlEl('div','tbl-wrap',c4);
  const t = htmlEl('table','data',wrap);
  const checkCols = ['statistical_significance','sample_size_adequacy','overdispersion_handled','cross_model_robustness','business_plausibility','data_recency','estimation_stability'];
  const checkHeads = {
    statistical_significance:'Significant?',
    sample_size_adequacy:'Enough data?',
    overdispersion_handled:'Noise handled?',
    cross_model_robustness:'Holds up?',
    business_plausibility:'Plausible?',
    data_recency:'Fresh?',
    estimation_stability:'Stable?',
  };
  t.innerHTML = `<thead><tr><th>ID</th><th>Action</th>${checkCols.map(c=>`<th>${checkHeads[c]}</th>`).join('')}<th>Overall</th></tr></thead>`;
  const tb = htmlEl('tbody',null,t);
  D.quality_check_matrix.forEach(r=>{
    const tr = htmlEl('tr',null,tb);
    tr.innerHTML = `<td class="mono">${r.id}</td><td style="white-space:normal;max-width:260px;">${plainCopy(r.title)}</td>` +
      checkCols.map(c=> `<td>${r[c]==='N/A'?'—':statusPill(r[c])}</td>`).join('') +
      `<td>${statusPill(r.overall_qc)}</td>`;
  });
}

const RENDERERS = {
  overview: renderOverview,
  elasticity: renderElasticity,
  choice: renderChoice,
  plc: renderPLC,
  brand: renderBrand,
  competitor: renderCompetitor,
  touchpoints: renderTouchpoints,
  simulator: renderSimulator,
  insights: renderInsights,
};
